<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f8ff;
            background-image: linear-gradient(to right, #00bfff, #ff007f);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Modal Styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease-in-out;
        }

        .modal h2 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .modal p {
            margin: 10px 0;
            font-size: 1rem;
        }

        .close-button {
            background-color: #ff007f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .close-button:hover {
            background-color: #00bfff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* CreditBook Logo */
        .logo {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 64px;
            font-weight: bold;
            text-shadow: 
                1px 1px 0px rgb(252, 251, 251),  
                -1px -1px 0px rgb(252, 251, 251), 
                -1px 1px 0px rgb(252, 251, 251),  
                1px -1px 0px rgb(252, 251, 251),  
                1px 0px 0px rgb(252, 251, 251),   
                -1px 0px 0px rgb(252, 251, 251),  
                0px 1px 0px rgb(252, 251, 251),   
                0px -1px 0px rgb(252, 251, 251);  
            margin-bottom: 20px;
            text-align: center;
        }

        .credit {
            color: #00bfff;
        }

        .book {
            color: #ff007f;
        }

        /* Credit Page Container */
        .section1 {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        /* Heading */
        .login-container h2 {
            font-size: 1.8rem;
            color: #ff007f;
            margin-bottom: 20px;
        }

        /* Form Styles */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        form div {
            text-align: left;
        }

        form label {
            font-size: 1rem;
            color: #333;
        }

        form input, form textarea {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        form textarea {
            height: 80px;
            resize: none;
        }

        /* Submit Button */
        form button {
            background-color: #00bfff;
            color: white;
            padding: 15px 0;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }

        form button:hover {
            background-color: #ff007f;
        }

        /* Back to Home Link */
        .buttons a {
            color: #00bfff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
        }

        .buttons a:hover {
            color: #ff007f;
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .section1 {
                width: 95%;
                padding: 20px;
            }

            .logo {
                font-size: 50px;
            }

            .login-container h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- CreditBook Logo -->
    <div class="logo">
        <span class="credit">Credit</span><span class="book">Book</span>
    </div>

    <!-- Credit Page Container -->
    <div class="section1"> 
        <div class="login-container">
            <h2>You are taking Credit from <h2 style="color: #00bfff;">{{ receiver_username }}</h2></h2>
            
            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="username" value="{{ receiver_username }}">
                <div>
                    <label for="amount">Amount:</label>
                    <input type="number" name="amount" step="1" required>
                </div>
                <div>
                    <label for="comment">Comment:</label>
                    <textarea name="comment" placeholder="Enter any additional comments here"></textarea>
                </div>
                <button type="submit">Submit Payment</button>
            </form>
        </div>
        <div class="buttons">

            <div id="confirmationModal" class="modal">
                <div class="modal-content">
                    <h2 id="modalTitle"></h2>
                    <p id="modalMessage"></p>
                    <p id="modalDetails"></p>
                    <button class="close-button" onclick="closeModal()">Close</button>
                </div>
            </div>
        
            <script>
                // JavaScript to handle modal display
                const status = "{{ status|default:'' }}"; // "success" or "failure"
                const message = "{{ message|default:'' }}";
                const receiverName = "{{ receiver_name|default:'' }}";
                const amount = "{{ amount|default:'' }}";
                const timestamp = "{{ timestamp|default:'' }}";
        
                // Show the modal if status exists
                if (status) {
                    const modal = document.getElementById("confirmationModal");
                    const titleElement = document.getElementById("modalTitle");
                    const messageElement = document.getElementById("modalMessage");
                    const detailsElement = document.getElementById("modalDetails");
        
                    if (status === "success") {
                        titleElement.textContent = "Credit Request Successful!";
                        messageElement.textContent = message;
                        detailsElement.textContent = `Receiver: ${receiverName} | Amount: ₹${amount} | Time: ${timestamp}`;
                    } else {
                        titleElement.textContent = "Credit Request Failed!";
                        messageElement.textContent = message;
                        detailsElement.textContent = ""; // No additional details for failure
                    }
        
                    modal.style.display = "flex"; // Show the modal
                }
        
                // Close modal function
                function closeModal() {
                    const modal = document.getElementById("confirmationModal");
                    modal.style.display = "none";
                }
            </script>
            <br>
            Back to <a href="{% url 'customer-dashboard' %}">Home</a>
        </div>
    </div>
</body>
</html>
