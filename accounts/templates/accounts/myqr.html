<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My QR Code</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/minified/html5-qrcode.min.js"></script>
    <style>
        /* Global Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #b3daf1, #ffb6c1);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Logo Styles */
        .logo {
            font-family: "Trebuchet MS", sans-serif;
            font-size: 55px;
            font-weight: bold;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        .logo span.credit {
            color: #00bfff;
        }
        .logo span.book {
            color: #ff007f;
        }

        /* Heading Styles */
       

        h3 {
            color: #555;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        /* QR Code Section */
        .qr-code {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            padding: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .qr-code img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }

        /* Download Button */
        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4A90E2;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .download-btn:hover {
            background-color: #357ABD;
        }

        /* Footer Section */
        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        footer a {
            color: #4A90E2;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Logo -->
    <div class="logo">
       <span class="credit">Credit</span><span class="book">Book</span> 
    </div>

    
    <div class="qr-code" id="qr-code-container">
        <h3>Scan this QR Code to take Credit from <h2  style="color: #00bfff;">{{ user.username }}</h2></h3>
        <img id="qr-code-img" src="data:image/png;base64,{{ qr_code }}" alt="QR Code">
        <!-- Download Button -->
        <a id="download-btn" class="download-btn" download="qr-code.png">Download QR Code</a>
    </div>

    <footer>
        Powered by <a href="#">CreditBook</a>
    </footer>

    <script>
        // Dynamically create and download the QR code with the logo and username
        document.getElementById('download-btn').addEventListener('click', function (e) {
            e.preventDefault();
            
            // Create a canvas element
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const qrImage = document.getElementById('qr-code-img');
            const logoText = "CreditBook";
            const merchantName = "{{ user.username }}";

            // Set canvas dimensions
            canvas.width = 400;
            canvas.height = 500;

            // Draw gradient background
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#b3daf1');
            gradient.addColorStop(1, '#ffb6c1');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw logo
            ctx.font = "55px 'Comic Sans MS'";
            ctx.textAlign = "center";
            ctx.fillStyle = "#00bfff";
            ctx.fillText("Credit  ", canvas.width / 2 - 60, 60);
            ctx.fillStyle = "#ff007f";
            ctx.fillText("Book", canvas.width / 2 + 60, 60);

            // Draw QR Code
            const img = new Image();
            img.src = qrImage.src;
            img.onload = function () {
                ctx.drawImage(img, 75, 100, 250, 250);

                // Add Merchant Name
                ctx.font = "20px Arial";
                ctx.fillStyle = "#333";
                ctx.fillText("Merchant: " + merchantName, canvas.width / 2, 400);

                // Generate download link
                const link = document.createElement('a');
                link.download = 'qr-code.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
        });
    </script>
</body>
</html>
